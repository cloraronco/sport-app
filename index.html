<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>FORGE</title>
<style>
  :root{
    --bg:#121316;
    --surface:#1c1e23;
    --surface-2:#25272e;
    --line:#33353c;
    --text:#eeeef0;
    --muted:#8b8d96;
    --effort:#ff5a2b;
    --effort-dim:#4a2a1c;
    --rest:#2bd67e;
    --rest-dim:#1b3d2c;
    --steel:#7C93A8;
    --steel-dim:#2A333B;
    --font-display:'Barlow Condensed', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  @font-face{font-family:'Barlow Condensed';src:local('Arial Narrow');}
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;color:var(--text);
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 120% 60% at 50% 100%, rgba(255,140,66,0.10), transparent 65%);
    font-family:'Segoe UI',Roboto,Arial,sans-serif; overscroll-behavior:none; user-select:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- MICRO-INTERACTIONS ---------- */
  button{transition:transform .12s ease, opacity .12s ease, filter .12s ease;}
  button:active{transform:scale(.96); filter:brightness(.92);}
  @keyframes screenIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .home, .session, .done-screen, .history{ animation:screenIn .22s ease; }
  @media (prefers-reduced-motion: reduce){
    button:active{transform:none;}
    .home, .session, .done-screen, .history{ animation:none; }
    .heat-bar{transition:none;}
  }

  /* ---------- PYRAMIDE THERMIQUE ---------- */
  .heat-pyramid{display:flex; flex-direction:column; gap:6px; margin:2px 0;}
  .heat-row{display:flex; align-items:center; gap:8px;}
  .heat-label{font-family:var(--font-mono); color:var(--muted); font-size:11px; width:20px;}
  .heat-track{flex:1; height:14px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .heat-bar{height:100%; border-radius:4px; transition:width .3s ease;}
  .heat-value{font-family:var(--font-mono); color:var(--text); font-size:13px; width:26px; text-align:right;}

  /* ---------- HOME ---------- */
  .home{padding:28px 22px 40px;display:flex;flex-direction:column;gap:22px;flex:1;}
  .brand{display:flex;align-items:flex-start;justify-content:space-between;flex-direction:column;gap:8px;}
  .brand-row{display:flex;align-items:baseline;justify-content:space-between;width:100%;}
  .brand h1{font-family:var(--font-display), sans-serif; font-weight:800; letter-spacing:2px;
    font-size:34px; margin:0; text-transform:uppercase; color:var(--text);
    text-shadow: 0 0 18px rgba(255,140,66,0.35);}
  .brand-ember{width:100%; height:3px; border-radius:2px;
    background:linear-gradient(90deg, #FFF3B0, #FF8C42, #8C1F0F, transparent);}
  .brand span{color:var(--effort);}
  .brand small{color:var(--muted); font-size:12px; letter-spacing:1px;}
  .hist-link{background:var(--surface); border:1px solid var(--line); color:var(--muted);
    font-size:13px; padding:8px 12px; border-radius:10px; letter-spacing:.5px;}
  .streak-badge{font-family:var(--font-mono); color:var(--effort); font-size:14px; letter-spacing:.5px;
    background:var(--effort-dim); border-radius:10px; padding:8px 12px; display:inline-block; width:fit-content;}

  /* ---------- HISTORIQUE ---------- */
  .history{padding:24px 20px 40px; display:flex; flex-direction:column; gap:16px; flex:1;}
  .hist-topbar{display:flex; align-items:center; justify-content:space-between;}
  .hist-topbar h1{font-family:var(--font-display), sans-serif; font-size:28px; text-transform:uppercase;
    letter-spacing:1px; margin:0;}
  .hist-back{color:var(--muted); background:none; border:none; font-size:13px; letter-spacing:1px;}
  .hist-empty{color:var(--muted); text-align:center; margin-top:60px; font-size:14px;}
  .hist-entry{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    display:flex; flex-direction:column; gap:6px;}
  .hist-entry.failed{border-color:var(--effort-dim);}
  .hist-row1{display:flex; justify-content:space-between; align-items:center;}
  .hist-prog{font-family:var(--font-display), sans-serif; font-size:19px; text-transform:uppercase;
    letter-spacing:.5px; font-weight:700;}
  .hist-date{font-family:var(--font-mono); color:var(--muted); font-size:12px;}
  .hist-status{font-size:12px; letter-spacing:.5px; padding:3px 8px; border-radius:6px;}
  .hist-status.ok{background:var(--rest-dim); color:var(--rest);}
  .hist-status.ko{background:var(--effort-dim); color:var(--effort);}
  .hist-detail{font-family:var(--font-mono); color:var(--muted); font-size:12px; line-height:1.5;}
  .hist-total{color:var(--text); font-size:13px;}

  .prog-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px;
    display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:border-color .15s, transform .1s;
    position:relative; overflow:hidden;}
  .prog-card::after{content:''; position:absolute; left:0; bottom:0; width:100%; height:3px;
    background:var(--ember-bar, linear-gradient(90deg, var(--effort), transparent));}
  .prog-card:active{transform:scale(.98);}
  .prog-card.sel{border-color:var(--effort);}
  .prog-card-simple{background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:26px 22px; display:flex; flex-direction:column; gap:8px; cursor:pointer;
    transition:border-color .15s, transform .1s; position:relative; overflow:hidden;}
  .prog-card-simple::after{content:''; position:absolute; left:0; bottom:0; width:100%; height:3px;
    background:var(--ember-bar, linear-gradient(90deg, var(--effort), transparent));}
  .prog-card-simple:active{transform:scale(.98); border-color:var(--effort);}
  .prog-card-simple h2{font-family:var(--font-display), sans-serif; font-size:34px; margin:0;
    font-weight:800; letter-spacing:1px; text-transform:uppercase;}
  .prog-sub{font-family:var(--font-mono); color:var(--muted); font-size:13px;}
  .prog-sub-total{color:var(--effort); font-weight:700;}
  .lifetime-badge{font-family:var(--font-mono); color:var(--effort); font-size:15px; font-weight:700;
    text-align:center; background:var(--effort-dim); border-radius:10px; padding:10px; letter-spacing:.3px;}
  .prog-head{display:flex; align-items:center; justify-content:space-between;}
  .prog-head h2{font-family:var(--font-display), sans-serif; font-size:26px; margin:0; font-weight:700; letter-spacing:1px; text-transform:uppercase;}
  .prog-count{font-family:var(--font-mono); color:var(--muted); font-size:13px;}
  .ex-row{display:flex; justify-content:space-between; font-size:14px; color:var(--muted); padding:2px 0;
    border-top:1px solid var(--line); padding-top:8px;}
  .ex-row:first-of-type{border-top:none; padding-top:0;}
  .ex-name{color:var(--text);}
  .ex-detail{font-family:var(--font-mono); color:var(--muted);}

  .stack{display:flex; gap:8px; margin-top:2px;}
  .stack .bar{flex:1; height:5px; border-radius:3px; background:var(--effort-dim);}

  .level-row{align-items:center;}
  .level-ctrl{display:flex; align-items:center; gap:8px;}
  .lvl-btn{background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px;
    width:28px; height:28px; font-size:16px; line-height:1; cursor:pointer;}
  .lvl-val{font-family:var(--font-mono); color:var(--text); min-width:20px; text-align:center;}

  .start-btn{margin-top:auto; background:var(--effort); color:#1a1a1a; border:none; border-radius:14px;
    padding:18px; font-family:var(--font-display), sans-serif; font-size:22px; font-weight:800;
    letter-spacing:2px; text-transform:uppercase; cursor:pointer;}
  .start-btn:disabled{background:var(--surface-2); color:var(--muted);}
  .maxtest-btn{margin-top:10px; background:none; border:1px solid var(--effort); color:var(--effort);
    padding:14px; border-radius:14px; font-family:var(--font-display), sans-serif; font-size:17px;
    font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer;}

  /* ---------- SESSION ---------- */
  .session{flex:1; display:flex; flex-direction:column; padding:20px; gap:16px;}
  .topbar{display:flex; align-items:center; justify-content:space-between;}
  .quit{color:var(--muted); font-size:13px; background:none; border:none; letter-spacing:1px;}
  .set-progress{font-family:var(--font-mono); color:var(--muted); font-size:13px;}

  .session.resting{animation:none;}
  .dots{display:flex; gap:6px; justify-content:center;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);}
  .dot.done{background:var(--effort); border-color:var(--effort);}
  .dot.active{background:var(--rest); border-color:var(--rest);}

  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center;}
  .ex-label{font-family:var(--font-display), sans-serif; font-size:30px; text-transform:uppercase;
    letter-spacing:1px; font-weight:700; color:var(--text); margin:0;}
  .mode-label{font-size:13px; letter-spacing:3px; color:var(--muted); text-transform:uppercase;}

  .big-number{font-family:var(--font-mono); font-weight:700; font-size:120px; line-height:1;
    margin:14px 0; transition:color .1s;}
  .big-number.effort{color:var(--effort);}
  .big-number.rest{color:var(--rest);}

  .sub-info{font-family:var(--font-mono); color:var(--muted); font-size:16px;}

  .tap-zone{width:100%; flex:0 0 auto; margin-top:18px;}
  .tap-btn{width:100%; padding:26px; border-radius:18px; border:none; font-family:var(--font-display), sans-serif;
    font-size:24px; font-weight:800; letter-spacing:2px; text-transform:uppercase; cursor:pointer;}
  .tap-btn.effort{background:var(--effort); color:#1a1a1a;}
  .tap-btn.rest{background:var(--rest-dim); color:var(--rest); border:1px solid var(--rest);}
  .tap-btn.hold{background:var(--effort); color:#1a1a1a;}
  .skip{margin-top:10px; width:100%; background:none; border:1px solid var(--line); color:var(--muted);
    padding:12px; border-radius:12px; font-size:13px; letter-spacing:1px;}

  /* ---------- DONE ---------- */
  .done-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px; text-align:center;}
  .done-screen h1{font-family:var(--font-display), sans-serif; font-size:44px; text-transform:uppercase; letter-spacing:2px; color:var(--rest); margin:0;}
  .congrats-msg{font-style:italic; color:var(--text); font-size:15px; max-width:280px;}
  .badge-unlock-block{background:var(--effort-dim); border:1px solid var(--effort); border-radius:12px;
    padding:14px 18px; display:flex; flex-direction:column; gap:6px; max-width:280px;}
  .badge-unlock-title{color:var(--effort); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.5px;}
  .badge-unlock{color:var(--text); font-size:14px;}
  .done-screen p{color:var(--muted); font-size:15px;}
  .again-btn{margin-top:10px; background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:14px; padding:16px 30px; font-family:var(--font-display), sans-serif; font-size:18px;
    letter-spacing:1px; text-transform:uppercase;}

  /* ---------- THÈME CLAIR (bascule "mode sombre" désactivée) ---------- */
  html[data-theme="light"]{
    --bg:#F5F3F0; --surface:#FFFFFF; --surface-2:#ECE9E4; --line:#DDD8D0;
    --text:#1B1C1F; --muted:#6B6D76;
    --effort:#E14E22; --effort-dim:#FBE2D6;
    --rest:#1FAE68; --rest-dim:#DCF3E7;
    --steel:#4B6478; --steel-dim:#DCE4EA;
  }

  /* ---------- AUTH ---------- */
  .auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px;
    width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px;}
  .auth-brand{font-family:var(--font-display), sans-serif; font-size:30px; letter-spacing:2px; margin:0; text-align:center; color:var(--effort);}
  .auth-card h3{margin:0; text-align:center; font-family:var(--font-display), sans-serif; font-size:20px; letter-spacing:1px; text-transform:uppercase;}
  .auth-form{display:flex; flex-direction:column; gap:10px;}
  .text-input{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px;
    color:var(--text); font-family:var(--font-mono); font-size:15px;}
  .primary-btn{background:var(--effort); color:#1a1a1a; border:none; border-radius:12px; padding:15px;
    font-family:var(--font-display), sans-serif; font-size:17px; font-weight:800; letter-spacing:1px; text-transform:uppercase;}
  .primary-btn:disabled{opacity:.5;}
  .link-btn{background:none; border:none; color:var(--effort); font-size:13px; font-weight:600; padding:4px; text-align:center;}
  .auth-error{color:#ff6b6b; font-size:13px; text-align:center; margin:0;}
  .auth-info{color:var(--rest); font-size:13px; text-align:center; margin:0;}

  /* ---------- HEADER / MENU / NOTIFS ---------- */
  #appHeader{position:sticky; top:0; z-index:30; background:var(--bg); padding:16px 16px 10px; border-bottom:1px solid var(--line);}
  .header-top{display:flex; align-items:center; justify-content:space-between;}
  #appHeader h1{margin:0; font-family:var(--font-display), sans-serif; font-size:24px; letter-spacing:2px;}
  .header-actions{display:flex; align-items:center; gap:8px;}
  .menu-btn{position:relative; width:38px; height:38px; border-radius:10px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--text); font-size:16px; cursor:pointer;}
  .header-avatar-btn{width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px;
    font-family:var(--font-display), sans-serif;}
  .menu-badge{position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px;
    background:var(--effort); color:#1a1a1a; border-radius:999px; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center;}
  .menu-panel, .notif-panel{position:absolute; top:56px; right:16px; z-index:40; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.35); padding:6px;}
  .menu-panel{min-width:190px;}
  .notif-panel{width:min(320px, calc(100vw - 32px)); max-height:70vh; overflow-y:auto; padding:14px;}
  .notif-panel h2{margin:0 0 8px; font-family:var(--font-display), sans-serif; font-size:16px; letter-spacing:1px; text-transform:uppercase;}
  .menu-item{display:block; width:100%; text-align:left; background:none; border:none; padding:11px 10px;
    border-radius:9px; color:var(--text); font-size:14px; font-weight:600; cursor:pointer;}
  .menu-item:active{background:var(--surface-2);}
  .notif-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--effort-dim); margin:0 -10px; padding:10px; border-radius:10px; border-bottom:none;}
  .notif-avatar{width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; color:#fff; font-weight:700; font-size:13px; font-family:var(--font-display), sans-serif;}
  .notif-body{flex:1; min-width:0;}
  .notif-text{font-size:13px; line-height:1.4; color:var(--text);}
  .notif-date{font-size:11px; color:var(--muted); margin-top:2px;}
  .notif-actions{display:flex; gap:14px; margin-top:6px;}
  .notif-actions button{background:none; border:none; padding:0; font-size:12.5px; font-weight:700; cursor:pointer;}
  .notif-actions .accept-btn{color:var(--rest);}
  .notif-actions .decline-btn{color:var(--muted);}
  .notif-empty, .state-msg{color:var(--muted); font-size:14px; text-align:center; padding:20px 10px;}

  /* ---------- TAB BAR ---------- */
  #tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
    background:var(--surface); border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
    color:var(--muted); font-size:10.5px; font-weight:700; letter-spacing:.3px; padding:6px 2px; border-radius:10px;}
  .tab-btn span{font-size:10.5px;}
  .tab-btn{font-size:19px;}
  .tab-btn.active{color:var(--effort);}
  #app{padding-bottom:82px;}
  body.immersive #appHeader, body.immersive #tabbar{display:none;}
  body.immersive #app{padding-bottom:0;}
  body:not(.logged-in) #appShell{display:none;}
  body.logged-in #authScreen{display:none;}

  /* ---------- ÉCRANS SECONDAIRES (Profil / Bilan / Paramètres / Communauté) ---------- */
  .screen-pad{padding:18px; padding-bottom:100px;}
  .screen-pad h2{margin:0 0 16px; font-family:var(--font-display), sans-serif; font-size:24px; letter-spacing:1px; text-transform:uppercase;}
  .back-link{background:none; border:none; color:var(--muted); font-size:13px; margin-bottom:14px; padding:0;}

  .profile-head{display:flex; align-items:center; gap:14px;}
  .avatar-circle{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:24px; font-family:var(--font-display), sans-serif; flex-shrink:0;}
  .profile-name{font-family:var(--font-display), sans-serif; font-size:20px; font-weight:700;}
  .profile-privacy{font-size:12px; color:var(--muted); margin-top:2px;}
  .profile-bio{font-size:14px; color:var(--text); margin:14px 0 0; line-height:1.5;}
  .profile-stats-row{display:flex; gap:24px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
  .profile-stat{display:flex; flex-direction:column;}
  .profile-stat-num{font-family:var(--font-display), sans-serif; font-size:20px; font-weight:700;}
  .profile-stat-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .profile-section-title{margin:26px 0 10px; font-family:var(--font-display), sans-serif; font-size:15px;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted);}
  .follow-btn{margin-top:16px; width:100%; background:var(--effort-dim); color:var(--effort); border:1px solid var(--effort);
    border-radius:12px; padding:12px; font-weight:700; font-size:13px; letter-spacing:.5px; text-transform:uppercase;}
  .follow-btn.following{background:var(--rest-dim); color:var(--rest); border-color:var(--rest);}
  .follow-btn.pending{background:var(--surface-2); color:var(--muted); border-color:var(--line);}

  .period-tabs{display:flex; gap:6px; margin-bottom:18px; overflow-x:auto;}
  .period-tab{flex-shrink:0; background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    padding:9px 14px; border-radius:999px; font-size:12.5px; font-weight:700; white-space:nowrap;}
  .period-tab.selected{background:var(--effort-dim); color:var(--effort); border-color:var(--effort);}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .stat-tile-num{font-family:var(--font-display), sans-serif; font-size:28px; font-weight:700; color:var(--effort);}
  .stat-tile-label{font-size:12px; color:var(--muted); margin-top:4px;}
  .share-bilan-btn{margin-top:20px; width:100%; background:var(--effort); color:#1a1a1a; border:none;
    border-radius:14px; padding:15px; font-family:var(--font-display), sans-serif; font-size:16px; font-weight:800;
    letter-spacing:1px; text-transform:uppercase;}

  .search-input{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; color:var(--text); font-family:var(--font-mono); font-size:14px; margin-bottom:12px;}
  .search-results{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
  .search-result-item{display:flex; align-items:center; gap:10px; padding:9px; border-radius:10px; background:none; border:none; width:100%; text-align:left;}
  .search-result-item:active{background:var(--surface-2);}
  .feed-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .feed-tab{flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    padding:10px; border-radius:12px; font-size:13px; font-weight:700;}
  .feed-tab.selected{background:var(--effort-dim); color:var(--effort); border-color:var(--effort);}
  .post-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;}
  .post-head{display:flex; align-items:center; gap:10px;}
  .post-avatar{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:13px; font-family:var(--font-display), sans-serif; flex-shrink:0;}
  .post-username{font-weight:700; font-size:14px;}
  .post-tagged{color:var(--muted); font-size:12px;}
  .post-date{color:var(--muted); font-size:11px;}
  .post-stats-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}

  .exercise-summary-name{font-weight:700; font-size:14px;}

  .add-exercise-btn{width:100%; background:var(--surface-2); border:1px dashed var(--line); color:var(--effort);
    border-radius:14px; padding:14px; font-weight:700; font-size:13.5px; letter-spacing:.3px;}

    margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .custom-workout-name{font-weight:700; font-size:14px;}

<body>
<div id="authScreen" class="auth-screen" hidden>

      <p class="hint" id="authPasswordHint" hidden>8 caractères minimum, avec majuscule, minuscule, chiffre et caractère spécial.</p>

</div>

<div id="appShell" hidden>
  <header id="appHeader">
    <div class="header-top">
      <h1>FORGE</h1>
      <div class="header-actions">

        <button type="button" id="notifBtn" class="menu-btn" aria-label="Notifications">🔔<span id="notifBadge" class="menu-badge" hidden></span></button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ==================================================================
   COMPTES + NAVIGATION + COMMUNAUTÉ (V1)
   ================================================================== */
const SUPABASE_URL = "https://yzaphewkjwubjbgaqfkv.supabase.co";
const SUPABASE_KEY = "sb_publishable_zHhuSAd-uFpxwlKtdxVF6w_N9RtWcKT";
let sb = null;
try{
  if(window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){ console.warn("Connexion Supabase indisponible :", e); }

let currentUser = null;
let currentProfile = null;
let authMode = "signin"; // "signin" | "signup"
let viewProfileId = null;   // profil consulté (null = le mien)
let bilanPeriod = "semaine";
let communityMode = "public"; // "public" | "mine"
let editingProfile = false;

/* ---------------- AVATAR ---------------- */
function avatarInitial(profile, fallbackEmail){
  const name = (profile && profile.username) || (fallbackEmail ? fallbackEmail.split("@")[0] : "?");
  return (name[0] || "?").toUpperCase();
}
function applyAvatarToEl(el, profile, fallbackEmail){
  if(!el) return;
  const url = profile && profile.avatar_url;
  if(url){
    el.textContent = "";
    el.style.background = `url("${url}") center/cover no-repeat`;
  } else {
    el.textContent = avatarInitial(profile, fallbackEmail);
    el.style.background = (profile && profile.avatar_color) || "#ff5a2b";
  }
}

/* ---------------- SESSION / AUTH ---------------- */
async function initAuth(){
  if(!sb){ renderAuthUI(); return; }
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session) await loadProfile(session.user);
  }catch(e){ /* la connexion se retentera au prochain essai */ }
  sb.auth.onAuthStateChange((event, session) => {
    if(session) loadProfile(session.user);
    else { currentUser = null; currentProfile = null; renderAuthUI(); }
  });
  renderAuthUI();
}
async function loadProfile(user){
  currentUser = user;
  try{
    const { data } = await sb.from("profiles").select("username, bio, avatar_color, avatar_url, is_private, tagging_permission").eq("id", user.id).single();
    currentProfile = data || null;
  }catch(e){ currentProfile = null; }
  renderAuthUI();
}
function renderAuthUI(){
  const loggedIn = !!currentUser;
  document.body.classList.toggle("logged-in", loggedIn);
  document.getElementById("authScreen").hidden = loggedIn;
  document.getElementById("appShell").hidden = !loggedIn;
  if(!loggedIn) return;
  updateHeaderAvatar();
  updateNotifBadge();
  render();
  renderChrome();
}

function authErrorMessage(err){
  const msg = ((err && err.message) || "").toLowerCase();
  if(msg.includes("already registered") || msg.includes("already been registered")) return "Un compte existe déjà avec cet email — connecte-toi plutôt.";
  if(msg.includes("invalid login credentials")) return "Email ou mot de passe incorrect.";
  if(msg.includes("password")) return "Le mot de passe doit faire au moins 8 caractères, avec majuscule, minuscule, chiffre et caractère spécial.";
  if(msg.includes("valid email") || msg.includes("email address")) return "Adresse email invalide.";
  if(msg.includes("email not confirmed")) return "Ton email n'est pas encore confirmé — clique sur le lien reçu par email.";
  return "Une erreur est survenue. Vérifie ta connexion et réessaie.";
}
function passwordIsStrongEnough(password){
  return password.length >= 8 && /[a-z]/.test(password) && /[A-Z]/.test(password) && /\d/.test(password) && /[^A-Za-z0-9]/.test(password);
}
function setAuthMode(mode){
  authMode = mode;
  document.getElementById("authTitle").textContent = mode === "signup" ? "Créer un compte" : "Se connecter";
  document.getElementById("authSubmitBtn").textContent = mode === "signup" ? "Créer mon compte" : "Se connecter";
  document.getElementById("authSwitchBtn").textContent = mode === "signup" ? "J'ai déjà un compte" : "Créer un compte";
  document.getElementById("authPasswordHint").hidden = mode !== "signup";
  document.getElementById("authError").hidden = true;
  document.getElementById("authInfo").hidden = true;
}

/* ---------------- HEADER : macaron / cloche / menu ---------------- */
function updateHeaderAvatar(){
  const btn = document.getElementById("headerAvatarBtn");
  if(btn) applyAvatarToEl(btn, currentProfile, currentUser && currentUser.email);
}
async function updateNotifBadge(){
  if(!currentUser || !sb) return;
  try{
    const { count } = await sb.from("notifications").select("id", { count:"exact", head:true }).eq("user_id", currentUser.id).eq("read", false);
    const badge = document.getElementById("notifBadge");
    if(!badge) return;
    badge.hidden = !count;
    badge.textContent = count > 9 ? "9+" : String(count || "");
  }catch(e){}
}

/* ---------------- NOTIFICATIONS ---------------- */
async function createNotification(userId, type, postId){
  if(!sb || !currentUser || userId === currentUser.id) return;
  try{
    await sb.from("notifications").insert({ user_id: userId, actor_id: currentUser.id, type, post_id: postId || null });
  }catch(e){ console.warn("Notification impossible :", e); }
}
function renderNotificationHTML(n){
  const p = n.actorProfile || {};
  const author = p.username || "quelqu'un";
  const text = n.type === "follow" ? `<b>${author}</b> a commencé à te suivre.`
    : n.type === "follow_request" ? `<b>${author}</b> souhaite te suivre.`
    : `<b>${author}</b> t'a tagué dans un bilan.`;
  const actions = n.type === "follow_request" ? `
    <div class="notif-actions">
      <button type="button" class="accept-btn" data-action="accept-follow">Accepter</button>
      <button type="button" class="decline-btn" data-action="decline-follow">Refuser</button>
    </div>` : "";
  const wrap = document.createElement("div");
  wrap.className = "notif-item" + (n.read ? "" : " unread");
  wrap.dataset.actorId = n.actor_id;
  wrap.dataset.notifId = n.id;
  const avatar = document.createElement("div");
  avatar.className = "notif-avatar";
  applyAvatarToEl(avatar, p, "");
  wrap.appendChild(avatar);
  const body = document.createElement("div");
  body.className = "notif-body";
  body.innerHTML = `<div class="notif-text">${text}</div><div class="notif-date">${formatRelativeDate(n.created_at)}</div>${actions}`;
  wrap.appendChild(body);
  return wrap;
}
function formatRelativeDate(iso){
  const d = new Date(iso);
  const diffH = Math.round((Date.now() - d.getTime()) / 3600000);
  if(diffH < 1) return "à l'instant";
  if(diffH < 24) return `il y a ${diffH}h`;
  const diffD = Math.round(diffH / 24);
  if(diffD < 7) return `il y a ${diffD}j`;
  return d.toLocaleDateString("fr-FR");
}
async function loadNotifications(){
  const listEl = document.getElementById("notificationsList");
  if(!listEl) return;
  if(!sb || !currentUser){ listEl.innerHTML = `<p class="notif-empty">Connecte-toi pour voir tes notifications.</p>`; return; }
  listEl.innerHTML = `<p class="notif-empty">Chargement…</p>`;
  try{
    const { data, error } = await sb.from("notifications")
      .select("id, actor_id, type, read, created_at, profiles!notifications_actor_id_fkey(username, avatar_color, avatar_url)")
      .eq("user_id", currentUser.id).order("created_at", { ascending:false }).limit(30);
    if(error) throw error;
    const notifs = (data || []).map(n => Object.assign({}, n, { actorProfile: n.profiles }));
    if(!notifs.length){ listEl.innerHTML = `<p class="notif-empty">Aucune notification pour l'instant.</p>`; return; }
    listEl.innerHTML = "";
    notifs.forEach(n => listEl.appendChild(renderNotificationHTML(n)));
    listEl.querySelectorAll('[data-action="accept-follow"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        const actorId = btn.closest(".notif-item").dataset.actorId;
        try{
          const { error } = await sb.from("follows").update({ status:"accepted" }).eq("follower_id", actorId).eq("followed_id", currentUser.id);
          if(error) throw error;
          btn.closest(".notif-actions").innerHTML = `<span class="hint" style="margin:0;">✅ Accepté</span>`;
        }catch(e){ console.warn(e); }
      });
    });
    listEl.querySelectorAll('[data-action="decline-follow"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        const actorId = btn.closest(".notif-item").dataset.actorId;
        try{
          const { error } = await sb.from("follows").delete().eq("follower_id", actorId).eq("followed_id", currentUser.id);
          if(error) throw error;
          btn.closest(".notif-actions").innerHTML = `<span class="hint" style="margin:0;">Refusé</span>`;
        }catch(e){ console.warn(e); }
      });
    });
    const unreadIds = notifs.filter(n => !n.read).map(n => n.id);
    if(unreadIds.length){
      await sb.from("notifications").update({ read:true }).in("id", unreadIds);
      updateNotifBadge();
    }
  }catch(e){
    listEl.innerHTML = `<p class="notif-empty">Impossible de charger les notifications.</p>`;
  }
}

/* ---------------- FOLLOW ---------------- */
function updateFollowBtnUI(btn, status){
  btn.classList.remove("following", "pending");
  if(status === "accepted"){ btn.textContent = "✓ Abonné(e)"; btn.classList.add("following"); }
  else if(status === "pending"){ btn.textContent = "Demande envoyée"; btn.classList.add("pending"); }
  else btn.textContent = "+ Suivre";
}
async function toggleFollow(targetId, isPrivate, btn){
  if(!sb || !currentUser) return;
  btn.disabled = true;
  try{
    const current = btn.textContent;
    if(current === "+ Suivre"){
      const status = isPrivate ? "pending" : "accepted";
      const { error } = await sb.from("follows").insert({ follower_id: currentUser.id, followed_id: targetId, status });
      if(error) throw error;
      await createNotification(targetId, status === "pending" ? "follow_request" : "follow");
      updateFollowBtnUI(btn, status);
    } else {
      const { error } = await sb.from("follows").delete().eq("follower_id", currentUser.id).eq("followed_id", targetId);
      if(error) throw error;
      updateFollowBtnUI(btn, null);
    }
  }catch(e){ console.warn("Action d'abonnement impossible :", e); }
  finally{ btn.disabled = false; }
}

/* ---------------- ÉCRAN COMMUNAUTÉ ---------------- */
function renderCommunaute(){
  return `
    <div class="screen-pad">
      <h2>Communauté</h2>
      <input type="text" id="communitySearchInput" class="search-input" placeholder="🔍 Rechercher un pseudo…" autocomplete="off">
      <div id="communitySearchResults" class="search-results"></div>
      <div class="feed-tabs">
        <button type="button" class="feed-tab${communityMode==='public'?' selected':''}" data-mode="public">🌍 Public</button>
        <button type="button" class="feed-tab${communityMode==='mine'?' selected':''}" data-mode="mine">👥 Mes abonnements</button>
      </div>
      <div id="feedList"><p class="state-msg">Chargement du fil…</p></div>
    </div>`;
}
let communitySearchTimer = null;
function attachCommunauteHandlers(){
  const input = document.getElementById("communitySearchInput");
  if(input){
    input.addEventListener("input", () => {
      clearTimeout(communitySearchTimer);
      const q = input.value.trim();
      const results = document.getElementById("communitySearchResults");
      if(!q){ results.hidden = true; results.innerHTML = ""; return; }
      communitySearchTimer = setTimeout(() => searchProfiles(q), 300);
    });
  }
  document.querySelectorAll(".feed-tab").forEach(btn => {
    btn.onclick = () => {
      if(btn.dataset.mode === communityMode) return;
      communityMode = btn.dataset.mode;
      document.querySelectorAll(".feed-tab").forEach(b => b.classList.toggle("selected", b === btn));
      loadFeed();
    };
  });
  loadFeed();
}
async function searchProfiles(q){
  const results = document.getElementById("communitySearchResults");
  if(!sb || !currentUser){ results.hidden = true; return; }
  try{
    const { data, error } = await sb.from("profiles").select("id, username, avatar_color, avatar_url")
      .ilike("username", `%${q}%`).neq("id", currentUser.id).limit(10);
    if(error) throw error;
    if(!data || !data.length){ results.hidden = false; results.innerHTML = `<p class="state-msg" style="padding:10px;">Aucun résultat.</p>`; return; }
    results.hidden = false;
    results.innerHTML = "";
    data.forEach(p => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "search-result-item";
      const avatar = document.createElement("div");
      avatar.className = "post-avatar";
      applyAvatarToEl(avatar, p, "");
      item.appendChild(avatar);
      const label = document.createElement("span");
      label.textContent = p.username || "?";
      item.appendChild(label);
      item.onclick = () => { viewProfileId = p.id; state.screen = "profil"; document.getElementById("communitySearchResults").hidden = true; input_clear(); render(); renderChrome(); };
      results.appendChild(item);
    });
  }catch(e){ results.hidden = false; results.innerHTML = `<p class="state-msg" style="padding:10px;">Recherche indisponible.</p>`; }
}
function input_clear(){ const i = document.getElementById("communitySearchInput"); if(i) i.value = ""; }
async function loadFeed(){
  const listEl = document.getElementById("feedList");
  if(!listEl) return;
  if(!sb || !currentUser){ listEl.innerHTML = `<p class="state-msg">Connecte-toi pour voir le fil.</p>`; return; }
  listEl.innerHTML = `<p class="state-msg">Chargement…</p>`;
  try{
    let query = sb.from("posts").select("id, user_id, type, period, stats, tagged_user_id, created_at, profiles!posts_user_id_fkey(username, avatar_color, avatar_url), tagged:profiles!posts_tagged_user_id_fkey(username)").order("created_at", { ascending:false }).limit(30);
    if(communityMode === "mine"){
      const { data: follows } = await sb.from("follows").select("followed_id").eq("follower_id", currentUser.id).eq("status", "accepted");
      const ids = (follows || []).map(f => f.followed_id);
      if(!ids.length){ listEl.innerHTML = `<p class="state-msg">Tu ne suis encore personne. Cherche un pseudo ci-dessus pour t'abonner.</p>`; return; }
      query = query.in("user_id", ids);
    }
    const { data, error } = await query;
    if(error) throw error;
    if(!data || !data.length){ listEl.innerHTML = `<p class="state-msg">Aucune publication pour l'instant.</p>`; return; }
    listEl.innerHTML = data.map(renderFeedCardHTML).join("");
  }catch(e){ listEl.innerHTML = `<p class="state-msg">Fil indisponible pour le moment.</p>`; }
}
function renderFeedCardHTML(post){
  const p = post.profiles || {};
  const avatarStyle = p.avatar_url ? `background:url('${p.avatar_url}') center/cover no-repeat;` : `background:${p.avatar_color || '#ff5a2b'};`;
  const initial = (p.username || "?")[0].toUpperCase();
  const taggedHtml = post.tagged && post.tagged.username ? `<span class="post-tagged">avec ${post.tagged.username}</span>` : "";
  const stats = post.stats || {};
  const chips = [
    stats.sessions != null ? `${stats.sessions} séance${stats.sessions>1?'s':''}` : null,
    stats.dureeMin != null ? `${stats.dureeMin} min` : null,
    stats.joursActifs != null ? `${stats.joursActifs} jour${stats.joursActifs>1?'s':''} actif${stats.joursActifs>1?'s':''}` : null,
    stats.tractions ? `${stats.tractions} tractions` : null,
    stats.abdos ? `${stats.abdos} abdos` : null,
    stats.pompes ? `${stats.pompes} pompes` : null
  ].filter(Boolean).map(c => `<span class="post-stat-chip">${c}</span>`).join("");
  return `
    <div class="post-card">
      <div class="post-head">
        <div class="post-avatar" style="${avatarStyle}">${p.avatar_url ? "" : initial}</div>
        <div>
          <div class="post-username">${p.username || "?"} ${taggedHtml}</div>
          <div class="post-date">${formatRelativeDate(post.created_at)} · Bilan de la semaine</div>
        </div>
      </div>
      <div class="post-stats-row">${chips || '<span class="post-stat-chip">Semaine calme</span>'}</div>
    </div>`;
}

/* ---------------- ÉCRAN PROFIL ---------------- */
function renderProfil(){
  return `<div class="screen-pad" id="profilContent"><p class="state-msg">Chargement…</p></div>`;
}
async function loadProfilScreen(){
  const wrap = document.getElementById("profilContent");
  if(!wrap) return;
  const targetId = viewProfileId || (currentUser && currentUser.id);
  const isOwn = !viewProfileId || (currentUser && targetId === currentUser.id);
  let profile = isOwn ? currentProfile : null;
  if(!isOwn && sb){
    try{
      const { data } = await sb.from("profiles").select("id, username, bio, avatar_color, avatar_url, is_private").eq("id", targetId).single();
      profile = data;
    }catch(e){}
  }
  if(!profile){ wrap.innerHTML = `<p class="state-msg">Profil introuvable.</p>`; return; }

  let followerCount = 0, followingCount = 0, followState = null;
  try{
    const [{ count:fc }, { count:fg }] = await Promise.all([
      sb.from("follows").select("follower_id", { count:"exact", head:true }).eq("followed_id", targetId).eq("status","accepted"),

/* ---------------- ÉCRAN BILAN ---------------- */
function bilanPeriodRange(period){
  const now = new Date();
  let start, end;
  if(period === "semaine"){
    const day = (now.getDay() + 6) % 7; // lundi = 0
    start = new Date(now); start.setHours(0,0,0,0); start.setDate(now.getDate() - day);
    end = new Date(start); end.setDate(start.getDate() + 7);
  } else if(period === "mois"){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  } else if(period === "annee"){
    start = new Date(now.getFullYear(), 0, 1);
    end = new Date(now.getFullYear() + 1, 0, 1);
  } else { // an_dernier
    start = new Date(now.getFullYear() - 1, 0, 1);
    end = new Date(now.getFullYear(), 0, 1);
  }
  return { start, end };
}
function computeBilanStats(period){
  const { start, end } = bilanPeriodRange(period);
  const entries = sessionHistory.filter(e => {
    const d = new Date(e.date);
    return e.validated && !e.isMaxTest && d >= start && d < end;
  });
  const sessions = entries.length;
  const dureeMin = entries.reduce((a,e) => a + (e.durationMin || 0), 0);
  const days = new Set(entries.map(e => { const d = new Date(e.date); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }));
  const exoCount = {};
  let tractions = 0, abdos = 0, pompes = 0;
  entries.forEach(e => {
    if(e.program === "tractions") tractions += e.exercises.reduce((a,ex)=>a+(ex.unit==='reps'?ex.volume:0),0);
    if(e.program === "abdos") abdos += e.exercises.reduce((a,ex)=>a+(ex.unit==='reps'?ex.volume:0),0);
    if(e.program === "pompes") pompes += e.exercises.reduce((a,ex)=>a+(ex.unit==='reps'?ex.volume:0),0);
    e.exercises.forEach(ex => { exoCount[ex.name] = (exoCount[ex.name]||0) + 1; });
  });
  let topExo = null, topCount = 0;
  Object.keys(exoCount).forEach(name => { if(exoCount[name] > topCount){ topCount = exoCount[name]; topExo = name; } });
  return { sessions, dureeMin, joursActifs: days.size, topExo, tractions, abdos, pompes };
}
function renderBilan(){

  const periods = [["semaine","Cette semaine"],["mois","Ce mois-ci"],["annee","Cette année"],["an_dernier","L'an dernier"]];

/* ---------------- DATA ---------------- */
// reps: exercice compté par répétitions tapées. time: exercice tenu, décompte automatique.
// rhythm = secondes par répétition (cadence auto, basée sur les recommandations
// de tempo contrôlé pour chaque mouvement). Aucune action requise pendant l'effort :
// le bip donne le rythme et le compteur avance seul.
// Chiffres alignés sur la page Notion "Programme Abdos — Bas du ventre" (séries/reps/repos/ordre).
// Pour bicycle crunch et dead bug, "par côté" dans Notion → target ici = total des deux côtés
// (compté automatiquement à chaque bip, sans distinction gauche/droite).
//
// Pompes : pyramide adaptative façon "100 Push-Ups Trainer". Une seule série est augmentée à
// chaque séance VALIDÉE EN ENTIER (aucune étape passée), en rotation (série 1, puis 2, 3, 4, 5,
// puis retour à 1...). Si la séance n'est pas complétée, rien ne change, tu retentes le même
// palier la prochaine fois — ça n'avance que si tu prouves que tu peux le faire.
// Incrément PROPORTIONNEL (~6% de la série, arrondi, minimum +1) plutôt qu'un +2 fixe : un +2 sur
// une série à 10 pèse 4x plus (en %) qu'un +2 sur une série à 32. Avec un % fixe, chaque série
// progresse à la même vitesse relative — plus sûr sur les petites séries, sans ralentir la 1ère.
let pompesPyramid = [32, 22, 18, 12, 10]; // valeurs de départ = ton niveau actuel dans l'appli payante
let pompesRotation = 0; // index (0-4) de la prochaine série à augmenter
const PROGRESSION_RATE = 0.06; // ~6% par palier, plancher +1
// Numéro de niveau : Niveau 1 = pyramide d'un vrai débutant (5-3-3-2-2, total 15 — un débutant
// plafonne autour de 5 reps en série max). Chaque palier de progression (+2 sur le total) = +1 niveau.
const BASELINE_TOTAL = 15;
function pompesLevelNumber(){
  const total = pompesPyramid.reduce((a,b)=>a+b,0);
  return 1 + Math.max(0, Math.round((total - BASELINE_TOTAL) / 2));
}
function syncPompesExercise(){
  PROGRAMS.pompes.exercises[0].pyramid = pompesPyramid.slice();
}
// Stockage 100% autonome (localStorage du navigateur) — fonctionne hors de l'environnement Claude,
// une fois l'appli ouverte directement depuis un fichier ou un hébergement indépendant.
const storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return { key, value: v };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value };
  }
};
function waitForStorage(){
  return Promise.resolve(); // localStorage est toujours dispo immédiatement, plus besoin d'attendre
}

/* ---------------- ÉCRAN ALLUMÉ PENDANT LA SÉANCE (Wake Lock) ---------------- */
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  }catch(e){ /* non supporté ou refusé par le navigateur, tant pis */ }
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  const activeScreens = ['session', 'freetest'];
  if(document.visibilityState === 'visible' && activeScreens.includes(state.screen)){
    requestWakeLock();
    if(actx && actx.state === 'suspended') actx.resume();
  }
});

/* ---------------- REPRISE AUTOMATIQUE (checkpoint de séance) ---------------- */
async function saveCheckpoint(exIdx, setIdx){
  await waitForStorage();
  try{
    const cp = {
      programKey: state.programKey, exIdx, setIdx,
      sessionFailed: state.sessionFailed, manualResults: (state.manualResults || []).slice(),
      savedAt: Date.now()
    };
    await storage.set('sessionCheckpoint', JSON.stringify(cp), false);
  }catch(e){}
}
async function clearCheckpoint(){
  await waitForStorage();
  try{ await storage.set('sessionCheckpoint', '', false); }catch(e){}
}
async function checkForResume(){
  await waitForStorage();
  try{
    const res = await storage.get('sessionCheckpoint', false);
    if(res && res.value){
      const cp = JSON.parse(res.value);
      const prog = cp.programKey && getProgram(cp.programKey);
      const validIdx = prog && cp.exIdx < prog.exercises.length && cp.setIdx < setsCount(prog.exercises[cp.exIdx]);
      const recent = cp.savedAt && (Date.now() - cp.savedAt) < 6 * 60 * 60 * 1000; // valable 6h
      if(prog && validIdx && recent){
        state.resumeCheckpoint = cp;
        state.screen = 'resumePrompt';
        render();
      } else {
        clearCheckpoint();
      }
    }
  }catch(e){ /* pas de checkpoint */ }
}
function resumeSession(){
  const cp = state.resumeCheckpoint;
  state.programKey = cp.programKey;
  state.exIdx = cp.exIdx;
  state.setIdx = cp.setIdx;
  state.sessionFailed = cp.sessionFailed;
  state.manualResults = cp.manualResults || [];
  state.screen = 'session';
  beginSet();
}
function discardResume(){
  clearCheckpoint();
  state.screen = 'home';
  render();
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sessionVolumeSummary(){
  return currentProgram().exercises.map(ex => {
    if(ex.pyramid) return { name: ex.name, detail: ex.pyramid.join('-'), volume: ex.pyramid.reduce((a,b)=>a+b,0), unit: 'reps' };
    if(ex.type === 'manual'){

      return { name: ex.name, detail: results.join('-'), volume: results.reduce((a,b)=>a+b,0), unit: 'reps' };

function bestSingleSeriesEverTrained(){
  // La plus grosse série jamais réalisée en séance classique (pas en test max), tirée de l'historique.
  let best = 0;
  sessionHistory.forEach(e => {
    if(e.program === 'pompes' && e.validated && !e.isMaxTest){
      e.exercises.forEach(ex => {
        if(ex.detail && ex.detail.includes('-')){
          const nums = ex.detail.split('-').map(Number).filter(n => !isNaN(n));
          if(nums.length){
            const m = Math.max(...nums);
            if(m > best) best = m;
          }
        }
      });
    }
  });
  return best;
}
function pompesPersonalRecord(){
  // Record perso = le meilleur entre le test max et la meilleure série jamais faite en entraînement classique.
  return Math.max(pompesMaxRecord, bestSingleSeriesEverTrained());
}

function adjustPompesLevel(direction){
  // Même logique que la validation réelle d'un entraînement, en avant ou en arrière —
  // ça tourne sur les 5 séries exactement pareil, plus de comportement différent entre les deux.
  if(direction > 0){
    progressPompesAfterSession();
  } else {
    pompesRotation = (pompesRotation - 1 + pompesPyramid.length) % pompesPyramid.length;
    const v = pompesPyramid[pompesRotation];
    const step = Math.max(2, Math.round(v * PROGRESSION_RATE));
    pompesPyramid[pompesRotation] = Math.max(1, v - step);
    syncPompesExercise();
    savePompesData();
  }
  render();
}
function progressPompesAfterSession(){
  const v = pompesPyramid[pompesRotation];
  const step = Math.max(2, Math.round(v * PROGRESSION_RATE)); // jamais moins de +2
  pompesPyramid[pompesRotation] = v + step;
  pompesRotation = (pompesRotation + 1) % pompesPyramid.length;
  syncPompesExercise();
  savePompesData();
}

/* ---------------- AUDIO ---------------- */
let actx;
function ctx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq, dur, vol){
  try{
    const c = ctx();
    if(c.state === 'suspended') c.resume(); // le navigateur suspend l'audio quand on quitte l'onglet/l'appli
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(c.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.stop(c.currentTime + dur);
  }catch(e){}
}

/* ---------------- HOME ---------------- */
function computeStreak(){
  // Jours consécutifs (n'importe quel programme) avec au moins une séance validée,
  // en remontant depuis aujourd'hui ou hier (le streak n'est pas "cassé" tant qu'on n'a pas raté une journée entière).
  const days = new Set();
  sessionHistory.forEach(e => {
    if(!e.validated) return;
    const d = new Date(e.date);
    days.add(d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate());
  });
  if(days.size === 0) return 0;
  const oneDay = 24*60*60*1000;
  const today = new Date(); today.setHours(0,0,0,0);
  let cursor = new Date(today);
  // Si rien fait aujourd'hui, on tolère et on commence à vérifier depuis hier.
  const todayKey = cursor.getFullYear()+'-'+(cursor.getMonth()+1)+'-'+cursor.getDate();
  if(!days.has(todayKey)) cursor = new Date(today.getTime() - oneDay);
  let streak = 0;
  while(true){
    const key = cursor.getFullYear()+'-'+(cursor.getMonth()+1)+'-'+cursor.getDate();
    if(days.has(key)){ streak++; cursor = new Date(cursor.getTime() - oneDay); }
    else break;
  }
  return streak;
}
function lifetimeStats(key){
  let total = 0, count = 0;
  sessionHistory.forEach(e => {
    if(e.program === key && e.validated){
      count++;
      // seuls les exercices en répétitions comptent dans le total ; les exercices en tenue (secondes)
      // ne doivent pas gonfler artificiellement le compteur de "reps" utilisé pour les badges.
      total += e.exercises.reduce((a,ex) => a + (ex.unit === 'reps' ? ex.volume : 0), 0);
    }
  });
  return { total, count };
}

function isoWeekKey(dateStr){
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  const weekNo = 1 + Math.round(((d-week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
  return d.getFullYear()+'-W'+weekNo;
}
function recordBreakerInSameMonth(program){
  const entries = sessionHistory.filter(e => e.program===program && e.isMaxTest && e.validated)
    .slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  let running = 0;
  const monthCounts = {};
  entries.forEach(e => {
    const vol = (e.exercises[0] && e.exercises[0].volume) || 0;
    if(vol > running){
      running = vol;
      const d = new Date(e.date);
      const mk = d.getFullYear()+'-'+d.getMonth();
      monthCounts[mk] = (monthCounts[mk]||0)+1;
    }
  });
  return Object.values(monthCounts).some(c => c>=2);
}
function computeBadges(){
  const badges = [];
  const thresholds = [100,500,1000,2000];
  Object.keys(PROGRAMS).forEach(key => {
    const total = lifetimeStats(key).total;
    thresholds.forEach(t => {
      badges.push({ id:`vol_${key}_${t}`, label:`${t} ${PROGRAMS[key].label.toLowerCase()}`,
        desc:`Atteindre ${t} répétitions au total en ${PROGRAMS[key].label.toLowerCase()}`,
        unlocked: total>=t, progress: Math.min(1,total/t), progressText:`${total}/${t}`, surprise:false });
    });
  });
  const totalSessions = sessionHistory.filter(e=>e.validated && !e.isMaxTest).length;
  [5,25,50].forEach(t => {
    badges.push({ id:`sessions_${t}`, label:`${t} séances validées`, desc:`Valider ${t} séances au total`,
      unlocked: totalSessions>=t, progress: Math.min(1,totalSessions/t), progressText:`${totalSessions}/${t}`, surprise:false });
  });
  const streak = computeStreak();
  [7,30].forEach(t => {
    badges.push({ id:`streak_${t}`, label:`${t} jours de suite`, desc:`Streak de ${t} jours consécutifs`,
      unlocked: streak>=t, progress: Math.min(1,streak/t), progressText:`${streak}/${t}`, surprise:false });
  });
  const lvl = pompesLevelNumber();
  [50,75,100].forEach(t => {
    badges.push({ id:`level_${t}`, label:`Niveau ${t} pompes`, desc:`Atteindre le niveau ${t} aux pompes`,
      unlocked: lvl>=t, progress: Math.min(1,lvl/t), progressText:`${lvl}/${t}`, surprise:false });
  });

  const earlyBird = sessionHistory.some(e => e.validated && new Date(e.date).getHours() < 7);
  badges.push({ id:'early_bird', label:'Lève-tôt', desc:'Valider une séance avant 7h du matin', unlocked: earlyBird, progress: earlyBird?1:0, surprise:true });

  const nightOwl = sessionHistory.some(e => e.validated && new Date(e.date).getHours() >= 22);
  badges.push({ id:'night_owl', label:'Oiseau de nuit', desc:'Valider une séance après 22h', unlocked: nightOwl, progress: nightOwl?1:0, surprise:true });

  const weekMap = {};
  sessionHistory.forEach(e => {
    if(!e.validated || e.isMaxTest) return;
    const wk = isoWeekKey(e.date);
    if(!weekMap[wk]) weekMap[wk] = new Set();
    weekMap[wk].add(e.program);
  });
  const tripleThreat = Object.values(weekMap).some(set => set.has('pompes') && set.has('abdos') && set.has('tractions'));
  badges.push({ id:'triple_threat', label:'Triple menace', desc:'Faire les 3 programmes dans la même semaine', unlocked: tripleThreat, progress: tripleThreat?1:0, surprise:true });

  const recordBreaker = recordBreakerInSameMonth('pompes') || recordBreakerInSameMonth('tractions');
  badges.push({ id:'record_breaker', label:'Chasseur de records', desc:'Battre ton record personnel 2 fois dans le même mois', unlocked: recordBreaker, progress: recordBreaker?1:0, surprise:true });

  const pompesEntries = sessionHistory.filter(e => e.program==='pompes' && !e.isMaxTest)
    .slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  let maxRun=0, cur=0;
  pompesEntries.forEach(e => { if(e.validated){ cur++; maxRun=Math.max(maxRun,cur);} else { cur=0; } });
  badges.push({ id:'perfect_pyramid', label:'Pyramide parfaite', desc:"5 séances de pompes validées d'affilée sans jamais passer d'étape",
    unlocked: maxRun>=5, progress: Math.min(1,maxRun/5), surprise:true });

  return badges;
}
function checkForNewBadges(){
  const badges = computeBadges();
  const unlockedIds = badges.filter(b=>b.unlocked).map(b=>b.id);
  const newOnes = unlockedIds.filter(id => !seenBadges.includes(id));
  if(newOnes.length){
    state.newBadges = badges.filter(b => newOnes.includes(b.id));
    seenBadges = seenBadges.concat(newOnes);
    saveSeenBadges();
  } else {
    state.newBadges = [];
  }
}

function estimateDuration(key){
  const p = getProgram(key);
  if(key === 'tractions'){
    // Pas de rythme imposé donc le temps d'effort n'est pas connu à l'avance : on donne une fourchette.
    const ex = p.exercises[0];
    const restTotal = (ex.sets - 1) * ex.rest;
    return { minSec: restTotal + ex.sets * 8, maxSec: restTotal + ex.sets * 30 };
  }
  let totalWork = 0, totalRest = 0;
  p.exercises.forEach((ex, exIdx) => {
    const n = setsCount(ex);
    for(let s = 0; s < n; s++){
      if(ex.pyramid) totalWork += ex.pyramid[s] * (ex.phase1.dur + ex.phase2.dur);
      else if(ex.type === 'reps') totalWork += targetFor(ex, s) * (ex.phase1.dur + ex.phase2.dur);
      else if(ex.type === 'time') totalWork += ex.target;
      const isLastSetOverall = (exIdx === p.exercises.length - 1) && (s === n - 1);
      if(!isLastSetOverall) totalRest += ex.rest;
    }
  });
  const total = totalWork + totalRest;
  return { minSec: total, maxSec: total };
}
function formatDuration(sec){
  const m = Math.round(sec / 60);
  if(m < 60) return `${m} min`;
  const h = Math.floor(m / 60), mm = m % 60;
  return `${h}h${mm > 0 ? String(mm).padStart(2,'0') : ''}`;
}
function durationLabel(key){
  const { minSec, maxSec } = estimateDuration(key);
  if(minSec === maxSec) return `≈ ${formatDuration(minSec)}`;
  return `≈ ${formatDuration(minSec)} - ${formatDuration(maxSec)}`;
}

const HEAT_COLORS = ['#FFF3B0', '#FFC24B', '#FF8C42', '#E84A27', '#8C1F0F'];
function renderThermalPyramid(pyramid){
  const max = Math.max(...pyramid);
  const bars = pyramid.map((v,i) => {
    const pct = Math.max(15, Math.round((v/max)*100));
    const color = HEAT_COLORS[i] || HEAT_COLORS[HEAT_COLORS.length-1];
    return `
      <div class="heat-row">
        <span class="heat-label">S${i+1}</span>
        <div class="heat-track"><div class="heat-bar" style="width:${pct}%; background:${color};"></div></div>
        <span class="heat-value">${v}</span>
      </div>`;
  }).join('');
  return `<div class="heat-pyramid">${bars}</div>`;
}

/* ---------------- SESSION HELPERS ---------------- */
function currentProgram(){ return getProgram(state.programKey); }
function currentExercise(){ return currentProgram().exercises[state.exIdx]; }
function setsCount(ex){ return ex.pyramid ? ex.pyramid.length : ex.sets; }
function targetFor(ex, setIdx){ return ex.pyramid ? ex.pyramid[setIdx] : ex.target; }

function startSession(key){
  state.programKey = key;
  state.screen = 'session';
  state.exIdx = 0; state.setIdx = 0;
  state.sessionFailed = false;
  state.manualResults = [];
  state.sessionStartedAt = Date.now();
  beginSet();
}

function beginSet(){
  clearInterval(state.timer);
  clearTimeout(state.phaseTimeout);
  const ex = currentExercise();
  state.mode = 'effort';
  state.paused = false;
  saveCheckpoint(state.exIdx, state.setIdx);
  requestWakeLock();

  if(ex.type === 'manual'){
    state.manualCount = 0; // à ton rythme, tu ajustes puis tu valides
    render();
    return;
  }
  if(ex.type === 'reps'){
    state.count = 0;
    runPhase1();
  } else {
    state.count = ex.target; // countdown for hold
    state.timer = setInterval(()=>{
      if(state.paused) return;
      state.count -= 1;
      if(state.count <= 0){
        clearInterval(state.timer);
        sndSetEnd();
        advanceAfterSet();
        return;
      }
      if(state.count <= 3) sndTick();
      render();
    }, 1000);
  }
  render();
}

function adjustManualCount(delta){
  state.manualCount = Math.max(0, state.manualCount + delta);
  render();
}
function validateManualSet(){
  state.manualResults[state.setIdx] = state.manualCount;
  sndSetEnd();
  advanceAfterSet();
}

function startPhase(durationMs, onDone){
  state.phaseOnDone = onDone;
  state.phaseEndTime = Date.now() + durationMs;
  state.phaseTimeout = setTimeout(onDone, durationMs);
}

function runPhase1(){
  const ex = currentExercise();
  state.repPhase = 1;
  render();
  startPhase(ex.phase1.dur * 1000, () => {
    sndTransition();
    runPhase2();
  });
}

function runPhase2(){
  const ex = currentExercise();
  state.repPhase = 2;
  render();
  startPhase(ex.phase2.dur * 1000, () => {
    state.count += 1;
    sndRep(); // toujours le même son de validation
    if(state.count >= targetFor(ex, state.setIdx)){
      sndSetEnd();
      advanceAfterSet();
    } else {
      runPhase1();
    }
  });
}

/* ---------------- MODE LIBRE : TEST MAX (pas de cible, rythme infini) ---------------- */
function startMaxTest(key){
  state.programKey = key;
  state.screen = 'freetest';
  state.count = 0;
  state.manualCount = 0;
  state.paused = false;
  if(key === 'pompes'){
    state.freeTestActive = true;
    runFreePhase1();
  } else {
    // tractions : pas de rythme imposé, saisie manuelle libre — voir renderFreeTest()
    render();
  }
}
function runFreePhase1(){
  if(!state.freeTestActive) return;
  const ex = PROGRAMS.pompes.exercises[0];
  state.repPhase = 1;
  render();
  startPhase(ex.phase1.dur * 1000, () => {
    if(!state.freeTestActive) return;
    sndTransition();
    runFreePhase2();
  });
}
function runFreePhase2(){
  if(!state.freeTestActive) return;
  const ex = PROGRAMS.pompes.exercises[0];
  state.repPhase = 2;
  render();
  startPhase(ex.phase2.dur * 1000, () => {
    if(!state.freeTestActive) return;
    state.count += 1;
    sndRep();
    runFreePhase1();
  });
}
function stopMaxTest(){
  state.freeTestActive = false;
  clearTimeout(state.phaseTimeout);
  state.editCount = state.programKey === 'tractions' ? state.manualCount : state.count;
  state.screen = 'freetestconfirm';
  render();
}
function adjustEditCount(delta){
  state.editCount = Math.max(0, state.editCount + delta);
  render();
}
function confirmMaxTest(){
  const result = state.editCount;
  const key = state.programKey;
  let isRecord;
  if(key === 'pompes'){
    const prevRecord = pompesPersonalRecord();
    isRecord = result > prevRecord;
    if(result > pompesMaxRecord){
      pompesMaxRecord = result;
      savePompesMaxRecord();
    }
    sessionHistory.unshift({
      date: new Date().toISOString(),
      program: 'pompes',
      label: 'Pompes (test max)',
      validated: true,
      isMaxTest: true,
      exercises: [{ name: 'Test max', detail: 'série libre jusqu\'à l\'échec', volume: result, unit: 'reps' }]
    });
  } else {
    const prevRecord = tractionsPersonalRecord();
    isRecord = result > prevRecord;
    sessionHistory.unshift({
      date: new Date().toISOString(),
      program: 'tractions',
      label: 'Tractions (test max)',
      validated: true,
      isMaxTest: true,
      exercises: [{ name: 'Test max', detail: 'série libre jusqu\'à l\'échec', volume: result, unit: 'reps' }]
    });
  }
  saveSessionHistory();
  checkForNewBadges();
  state.freeTestResult = result;
  state.freeTestRecord = isRecord;
  sndFinish();
  state.screen = 'freetestdone';
  render();
}

function togglePause(){
  const ex = currentExercise();
  if(ex.type === 'manual' && state.mode === 'effort') return; // pas de chrono en saisie manuelle
  if(state.mode === 'effort' && ex.type === 'reps'){
    if(!state.paused){
      clearTimeout(state.phaseTimeout);
      state.phaseRemaining = Math.max(0, state.phaseEndTime - Date.now());
      state.paused = true;
    } else {
      state.paused = false;
      state.phaseEndTime = Date.now() + state.phaseRemaining;
      state.phaseTimeout = setTimeout(state.phaseOnDone, state.phaseRemaining);
    }
  } else {
    state.paused = !state.paused;
  }
  render();
}

function advanceAfterSet(){
  const ex = currentExercise();
  const isLastSet = state.setIdx >= setsCount(ex) - 1;
  const isLastEx = state.exIdx >= currentProgram().exercises.length - 1;

  if(isLastSet && isLastEx){
    finishSession();
    return;
  }

  // start rest
  state.mode = 'rest';
  state.count = ex.rest;
  state.paused = false;
  // checkpoint pointant déjà vers la prochaine série (celle qui reprendra après le repos)
  const nextExIdx = isLastSet ? state.exIdx + 1 : state.exIdx;
  const nextSetIdx = isLastSet ? 0 : state.setIdx + 1;
  saveCheckpoint(nextExIdx, nextSetIdx);
  render();
  state.timer = setInterval(()=>{
    if(state.paused) return;
    state.count -= 1;
    if(state.count <= 0){
      clearInterval(state.timer);
      sndRestEnd();
      if(isLastSet){
        state.exIdx += 1; state.setIdx = 0;
      } else {
        state.setIdx += 1;
      }
      beginSet();
      return;
    }
    if(state.count <= 3) sndTick();
    render();
  }, 1000);
}

function skipStep(){
  const ex = currentExercise();
  if(state.mode === 'effort'){
    clearInterval(state.timer);
    clearTimeout(state.phaseTimeout);
    state.sessionFailed = true; // étape passée = séance non complétée à 100%
    sndSetEnd();
    advanceAfterSet();
  } else if(state.mode === 'rest'){
    clearInterval(state.timer);
    sndRestEnd();
    const isLastSet = state.setIdx >= setsCount(ex) - 1;
    if(isLastSet){ state.exIdx += 1; state.setIdx = 0; } else { state.setIdx += 1; }
    beginSet();
  }
}

function quitSession(){
  clearInterval(state.timer);
  clearTimeout(state.phaseTimeout);
  clearCheckpoint();
  releaseWakeLock();
  state.screen = 'home';
  render();
}

function finishSession(){
  clearInterval(state.timer);
  clearTimeout(state.phaseTimeout);
  clearCheckpoint();
  releaseWakeLock();
  sndFinish();
  state.levelChanged = null;
  const validated = !state.sessionFailed;
  logSession(validated);
  checkForNewBadges();
  if(state.programKey === 'pompes'){
    if(validated){
      progressPompesAfterSession();
      state.levelChanged = 'up';
    } else {
      state.levelChanged = 'same';
    }
  }
  state.screen = 'done';
  render();
}

/* ---------------- SESSION RENDER ---------------- */
function renderSession(){
  const prog = currentProgram();
  const ex = currentExercise();
  const totalSets = setsCount(ex);
  const dots = Array.from({length: totalSets}).map((_,i) => {
    let cls = 'dot';
    if(state.mode === 'rest'){
      // en récupération, la série qu'on vient de finir passe en "done" (orange) : plus rien n'est "actif" tant qu'on n'a pas repris.
      if(i <= state.setIdx) cls += ' done';
    } else {
      if(i < state.setIdx) cls += ' done';
      else if(i === state.setIdx) cls += ' active';
    }
    const heatColor = ex.pyramid ? (HEAT_COLORS[i] || HEAT_COLORS[HEAT_COLORS.length-1]) : null;
    const style = heatColor && (i <= state.setIdx) ? ` style="background:${heatColor}; border-color:${heatColor};"` : '';
    return `<div class="${cls}"${style}></div>`;
  }).join('');

  if(state.mode === 'effort' && ex.type === 'manual'){
    return `
    <div class="session">
      <div class="topbar">
        <button class="quit" id="quitBtn">✕ QUITTER</button>
        <span class="set-progress">${prog.label.toUpperCase()} · SÉRIE ${state.setIdx+1}/${totalSets}</span>
      </div>
      <div class="dots">${dots}</div>
      <div class="stage">
        <div class="mode-label">à ton rythme — arrête-toi à 1 rep de l'échec</div>
        <h1 class="ex-label">${ex.name}</h1>
        <div class="big-number effort">${state.manualCount}</div>
        <div class="sub-info">indique le nombre réalisé, puis valide</div>
      </div>
      <div class="tap-zone">
        <div class="level-ctrl" style="justify-content:center; gap:20px; margin-bottom:14px;">
          <button class="lvl-btn" id="manualMinusBtn" style="width:44px; height:44px; font-size:22px;">−</button>
          <button class="lvl-btn" id="manualPlusBtn" style="width:44px; height:44px; font-size:22px;">+</button>
        </div>
        <button class="tap-btn effort" id="validateManualBtn">VALIDER LA SÉRIE</button>
      </div>
    </div>`;
  }

  let big, sub, modeLabel;
  if(state.mode === 'effort'){
    if(ex.type === 'reps'){
      big = state.count;
      const p = state.repPhase === 1 ? ex.phase1 : ex.phase2;
      const t = targetFor(ex, state.setIdx);
      const targetTxt = ex.perSide ? `${t} (${ex.perSide}/côté)` : t;
      sub = `objectif ${targetTxt} reps · ${p.label} (${p.dur}s)`;
      modeLabel = 'effort — cadence auto';
    } else {
      big = state.count;
      sub = `tenir ${ex.target}s`;
      modeLabel = 'maintien';
    }
  } else {
    big = state.count;
    sub = 'récupération';
    modeLabel = 'repos';
  }

  const numClass = state.mode === 'rest' ? 'rest' : 'effort';
  const pauseLabel = state.paused ? '▶ REPRENDRE' : '❙❙ PAUSE';
  const pauseClass = state.mode === 'rest' ? 'rest' : 'effort';

  return `
    <div class="session${state.mode === 'rest' ? ' resting' : ''}">
      <div class="topbar">
        <button class="quit" id="quitBtn">✕ QUITTER</button>
        <span class="set-progress">${prog.label.toUpperCase()} · SÉRIE ${state.setIdx+1}/${totalSets}</span>
      </div>
      <div class="dots">${dots}</div>
      <div class="stage">
        <div class="mode-label">${state.paused ? 'EN PAUSE' : modeLabel}</div>
        <h1 class="ex-label">${ex.name}</h1>
        <div class="big-number ${numClass}" style="${state.paused?'opacity:.4;':''}">${big}</div>
        <div class="sub-info">${sub}</div>
      </div>
      <div class="tap-zone">
        <button class="tap-btn ${pauseClass}" id="pauseBtn">${pauseLabel}</button>
        <button class="skip" id="skipBtn">Passer cette étape</button>
      </div>
    </div>`;
}

/* ---------------- HISTORIQUE ---------------- */
function renderProgressChart(){
  // Une série par programme, points triés du plus ancien au plus récent, uniquement les séances validées.
  const W = 320, H = 150, PAD_L = 30, PAD_B = 20, PAD_T = 12, PAD_R = 12;
  const colors = { pompes: 'var(--effort)', abdos: 'var(--rest)' };
  const series = {};
  Object.keys(PROGRAMS).forEach(k => series[k] = []);
  sessionHistory.slice().reverse().forEach(e => {
    if(!e.validated) return;
    const total = e.exercises.reduce((a,ex)=>a+ex.volume,0);
    if(series[e.program]) series[e.program].push(total);
  });
  const allVals = Object.values(series).flat();
  if(allVals.length < 2) return ''; // pas assez de données validées pour un graphique utile
  const maxV = Math.max(...allVals) * 1.1;
  const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;

  function pathFor(vals){
    if(vals.length === 0) return { line: '', dots: '' };
    const stepX = vals.length > 1 ? plotW / (vals.length - 1) : 0;
    const pts = vals.map((v,i) => {
      const x = PAD_L + i * stepX;
      const y = PAD_T + plotH - (v / maxV) * plotH;
      return [x,y];
    });
    const line = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join('');
    return { line, dots };
  }

  let svgSeries = '';
  Object.keys(series).forEach(key => {
    const { line, dots } = pathFor(series[key]);
    if(!line) return;
    svgSeries += `<path d="${line}" fill="none" stroke="${colors[key]}" stroke-width="2"/>`;
    svgSeries += `<g fill="${colors[key]}">${dots}</g>`;
  });

  const legend = Object.keys(PROGRAMS).filter(k => series[k].length > 0).map(k =>
    `<span style="display:inline-flex; align-items:center; gap:5px; margin-right:14px;">
      <span style="width:9px; height:9px; border-radius:50%; background:${colors[k]}; display:inline-block;"></span>
      <span style="color:var(--muted); font-size:12px;">${PROGRAMS[k].label} (total/séance)</span>
    </span>`).join('');

  return `
    <div class="hist-entry" style="gap:10px;">
      <span class="hist-prog" style="font-size:16px;">Progression</span>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
        <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T+plotH}" stroke="var(--line)" stroke-width="1"/>
        <line x1="${PAD_L}" y1="${PAD_T+plotH}" x2="${W-PAD_R}" y2="${PAD_T+plotH}" stroke="var(--line)" stroke-width="1"/>
        ${svgSeries}
      </svg>
      <div>${legend}</div>
    </div>`;
}
function renderTrophies(){
  const badges = computeBadges();
  const unlocked = badges.filter(b => b.unlocked);
  const locked = badges.filter(b => !b.unlocked);
  const card = (b) => {
    if(!b.unlocked && b.surprise){
      return `
      <div class="hist-entry">
        <div class="hist-row1">
          <span class="hist-prog">🔒 ???</span>
        </div>
        <span class="hist-detail">Badge surprise — continue pour le découvrir</span>
      </div>`;
    }
    const bar = !b.unlocked ? `
        <div style="background:var(--surface-2); border-radius:6px; height:6px; overflow:hidden; margin-top:6px;">
          <div style="background:var(--effort); height:100%; width:${Math.round(b.progress*100)}%;"></div>
        </div>` : '';
    return `
      <div class="hist-entry ${b.unlocked ? '' : 'failed'}">
        <div class="hist-row1">
          <span class="hist-prog">${b.unlocked ? '🏆' : '🔒'} ${b.label}</span>
        </div>
        <span class="hist-detail">${b.desc}${b.progressText ? ' · '+b.progressText : ''}</span>
        ${bar}
      </div>`;
  };
  return `
    <div class="history">
      <div class="hist-topbar">
        <button class="hist-back" id="histBackBtn">← RETOUR</button>
        <h1>Trophées</h1>
        <span style="font-family:var(--font-mono); color:var(--muted); font-size:13px;">${unlocked.length}/${badges.length}</span>
      </div>
      ${unlocked.map(card).join('')}
      ${locked.map(card).join('')}
    </div>`;
}
function generateExportText(){
  const today = new Date().toLocaleDateString('fr-FR');
  const pompesLifetime = lifetimeStats('pompes').total;
  const abdosLifetime = lifetimeStats('abdos').total;
  const tractionsLifetime = lifetimeStats('tractions').total;
  return `| ${today} | ${pompesLevelNumber()} | ${pompesLifetime} | ${abdosLifetime} | ${tractionsLifetime} |`;
}
async function exportToClipboard(){
  const text = generateExportText();
  try{
    await navigator.clipboard.writeText(text);
    alert('Copié ! Colle cette ligne dans le tableau de la page Notion "Application FORGE — Export".');
  }catch(e){

function attachWorkoutBuilderHandlers(){
  const labelInput = document.getElementById('workoutLabelInput');
  if(labelInput) labelInput.oninput = () => { workoutDraft.label = labelInput.value; };

  const backBtn = document.getElementById('builderBackBtn');
  if(backBtn) backBtn.onclick = closeWorkoutBuilder;

  const openBtn = document.getElementById('openAddExerciseBtn');
  if(openBtn) openBtn.onclick = () => { exerciseDraft = newExerciseDraft(); render(); };

  const cancelBtn = document.getElementById('cancelAddExerciseBtn');
  if(cancelBtn) cancelBtn.onclick = () => { exerciseDraft = null; render(); };

  const nameInput = document.getElementById('exNameInput');
  if(nameInput) nameInput.oninput = () => { exerciseDraft.name = nameInput.value; };

  document.querySelectorAll('.stepper-btn').forEach(btn => {
    btn.onclick = () => {
      const field = btn.dataset.field;
      const delta = parseFloat(btn.dataset.delta);
      const bounds = {
        sets: [1, 12], rest: [0, 300], target: [1, 100], descente: [0.3, 5], montee: [0.3, 5]
      }[field];
      let val = exerciseDraft[field] + delta;
      val = Math.min(bounds[1], Math.max(bounds[0], val));
      exerciseDraft[field] = (field === 'descente' || field === 'montee') ? Math.round(val * 10) / 10 : Math.round(val);
      render();
    };
  });

  document.querySelectorAll('#exModePicker button').forEach(btn => {
    btn.onclick = () => { exerciseDraft.mode = btn.dataset.value; render(); };
  });

  const confirmAddBtn = document.getElementById('confirmAddExerciseBtn');
  if(confirmAddBtn) confirmAddBtn.onclick = () => {
    const name = (document.getElementById('exNameInput').value || '').trim();
    if(!name){ alert('Donne un nom à l\'exercice.'); return; }
    exerciseDraft.name = name;
    workoutDraft.exercises.push(exerciseDraft);
    exerciseDraft = null;
    render();
  };

  document.querySelectorAll('[data-remove-ex]').forEach(btn => {
    btn.onclick = () => {
      workoutDraft.exercises.splice(parseInt(btn.dataset.removeEx, 10), 1);
      render();
    };
  });

  const saveBtn = document.getElementById('saveWorkoutBtn');
  if(saveBtn) saveBtn.onclick = async () => {
    const label = (document.getElementById('workoutLabelInput').value || '').trim();
    if(!label){ alert('Donne un nom à ta séance.'); return; }
    if(!workoutDraft.exercises.length){ alert('Ajoute au moins un exercice.'); return; }
    const key = workoutDraft.editingKey || ('custom_' + Date.now());
    customPrograms[key] = {
      label,
      custom: true,
      exercises: workoutDraft.exercises.map(ex => {
        if(ex.mode === 'manual') return { name: ex.name, type: 'manual', sets: ex.sets, rest: ex.rest };
        return {
          name: ex.name, type: 'reps', target: ex.target, sets: ex.sets, rest: ex.rest,
          phase1: { label: 'Descente', dur: ex.descente }, phase2: { label: 'Montée', dur: ex.montee }
        };
      })
    };
    await saveCustomPrograms();
    workoutDraft = null; exerciseDraft = null;
    state.screen = 'history';
    render();
  };
}
async function deleteCustomWorkout(key){
  if(!confirm('Supprimer définitivement cet entraînement ?')) return;
  delete customPrograms[key];
  await saveCustomPrograms();
  state.screen = 'history';
  render();
}
